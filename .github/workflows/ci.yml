name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # O npm do runner apresentou falha interna do Arborist (edgesOut) antes
      # da instalação. Mantemos uma versão estável até existir lockfile.
      - name: Pin npm version
        run: npm install --global npm@10.8.2

      # O erro edgesOut também ocorre durante a resolução moderna de peers.
      # --legacy-peer-deps evita esse caminho interno do Arborist; testes e build
      # continuam obrigatórios para validar a compatibilidade real da aplicação.
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build
