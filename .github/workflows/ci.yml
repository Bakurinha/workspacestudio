name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # O npm 10.9.8 do runner apresentou falha interna do Arborist (edgesOut)
      # antes da instalação. Fixamos uma versão estável até existir lockfile.
      - name: Pin npm version
        run: npm install --global npm@10.8.2

      # Enquanto não houver package-lock.json usamos npm install. Com o lockfile,
      # esta etapa deve ser trocada por npm ci para garantir instalação determinística.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build
